<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta-Eval · 分数矩阵编辑器</title><link rel="stylesheet" href="score-matrix/styles.css"></head>
<body><header><div class="brand"><b class="mark">M</b><strong>META—EVAL</strong><span> / 分数矩阵</span></div><span class="local">v7 · K=5</span><div id="stats" class="stats"></div></header>
<main>
<section class="controls" aria-label="筛选"><label>模型<input id="modelSearch" type="search" placeholder="搜索模型…"></label><label>Benchmark<input id="benchSearch" type="search" placeholder="搜索测评…"></label><label>家族<select id="family"><option value="">全部家族</option></select></label><label>成绩类型<select id="mode"><option value="actual">实测成绩</option><option value="filled">实测 + 预测补齐</option><option value="predicted">MIRT 预测</option></select></label></section>
<div class="workspace"><section class="matrix-area"><div class="toolbar"><div class="legend"><span><i class="observed"></i>有实测</span><span><i class="missing"></i>缺失实测</span><span><i class="prediction"></i>预测</span><span><i class="edited"></i>已编辑</span></div><div class="actions"><select id="color" aria-label="颜色模式"><option value="coverage">覆盖情况</option><option value="score">分数深浅</option></select><select id="size" aria-label="格子大小"><option value="fit">全部模型 · 全景</option><option value="16">放大编辑</option><option value="10">超紧凑</option><option value="24">舒适</option></select></div></div>
<div class="subtoolbar"><label class="inline"><input id="onlyMissing" type="checkbox">仅显示有缺失的模型</label><select id="order" aria-label="模型排序"><option value="rank">综合能力排名</option><option value="missing">缺失最多优先</option></select><button id="reset">重置筛选</button><button id="export">导出当前 CSV</button></div>
<div id="tableWrap" class="table-wrap" tabindex="0" aria-label="分数矩阵，可横向和纵向滚动"><canvas id="overview" tabindex="0" aria-label="v7 全景矩阵，全部模型与测评，悬停查看，点击编辑，方向键选择"></canvas><table id="matrix"></table></div><div id="status" class="status" role="status"></div></section>
<aside id="detail" class="detail"><div class="panel-label">详情 / 编辑</div><div id="inspector"></div></aside></div>
<div id="notice" role="status" aria-live="polite"></div>
</main><script src="score-matrix/app.js" defer></script></body></html>
